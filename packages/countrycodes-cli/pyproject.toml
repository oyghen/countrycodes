[project]
name = "countrycodes-cli"
version = "0.1.0rc4"
description = "Command-line interface for the countrycodes library"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["countrycodes==0.1.0rc4", "rich>=13.7.1", "typer>=0.24.1"]

[project.scripts]
countrycodes = "countrycodes_cli.cli:app"

[tool.uv.sources]
countrycodes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
